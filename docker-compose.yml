name: shopai
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PRODUCT_DB_USER: ${PRODUCT_DB_USER:?Set PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?Set PRODUCT_DB_PASSWORD}
      AI_DB_USER: ${AI_DB_USER:?Set AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
    restart: unless-stopped
  product-service:
    build: ./backend/product-service
    environment:
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/shopai_product
      PRODUCT_DB_USER: ${PRODUCT_DB_USER}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:${PRODUCT_PORT:-8081}:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
  ai-orchestrator:
    build: ./ai-services/ai-orchestrator
    environment:
      AI_DATABASE_URL: postgresql://${AI_DB_USER}:${AI_DB_PASSWORD}@postgres:5432/shopai_ai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      PRODUCT_SERVICE_URL: http://product-service:8081
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:${AI_PORT:-8000}:8000"]
    depends_on:
      product-service: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
  frontend:
    build: ./frontend/shopai-web
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:8080"]
    depends_on:
      product-service: {condition: service_healthy}
      ai-orchestrator: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
networks:
  internal:
    driver: bridge
volumes:
  postgres-data:
  redis-data:
