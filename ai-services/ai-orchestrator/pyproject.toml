[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "shopai-ai-orchestrator"
version = "0.1.0"
description = "ShopAI catalog shopping assistant, recommendations, and AI service foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1", "uvicorn[standard]>=0.38,<1", "pydantic-settings>=2.11,<3",
  "httpx>=0.28,<1", "redis>=6.4,<8", "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2"]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
