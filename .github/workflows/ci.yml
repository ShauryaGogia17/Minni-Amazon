name: Phase 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/shopai-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make install
      - run: make test
      - run: npm --prefix frontend/shopai-web run build
      - run: make env && docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: make smoke
      - run: npx playwright install --with-deps chrome
        working-directory: frontend/shopai-web
      - run: SHOPAI_E2E_BASE_URL=http://127.0.0.1:5173 make e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
