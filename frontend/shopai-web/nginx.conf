server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/v1/ai/ { proxy_pass http://ai-orchestrator:8000; proxy_set_header X-Request-ID $request_id; }
    location /api/ { proxy_pass http://product-service:8081; proxy_set_header X-Request-ID $request_id; }
    location = /health/ai/ready { proxy_pass http://ai-orchestrator:8000/health/ready; }
    location = /health/catalog { proxy_pass http://product-service:8081/actuator/health/readiness; }
    location / { try_files $uri $uri/ /index.html; }
}
